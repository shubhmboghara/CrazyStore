<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base squircle with smooth continuous corners -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  
  <!-- Subtle top glass reflection highlight -->
  <path d="M 0 124 C 0 55.5 55.5 0 124 0 L 388 0 C 456.5 0 512 55.5 512 124 L 512 170 C 340 210 172 180 0 145 Z" fill="#ffffff" fill-opacity="0.15" />

  <!-- Phone with OLED screen -->
  <g filter="url(#phoneShadow)">
    <rect x="132" y="66" width="248" height="380" rx="46" fill="url(#screenGlass)" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" />
    
    <!-- Camera notch -->
    <rect x="226" y="98" width="60" height="7" rx="3.5" fill="#52525b" />
    
    <!-- Bold energetic lightning spark (Crazy Store) -->
    <path d="M288 146 L198 274 L258 274 L224 366 L314 238 L254 238 Z" fill="url(#boltGrad)" />
    
    <!-- Bottom home indicator -->
    <rect x="216" y="414" width="80" height="7" rx="3.5" fill="#52525b" />
  </g>
</svg>