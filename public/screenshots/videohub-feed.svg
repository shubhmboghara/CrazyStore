<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="1080" height="2340">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090d"/>
      <stop offset="50%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="thumbGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#3b1d60"/>
      <stop offset="100%" stop-color="#110d24"/>
    </linearGradient>
    <linearGradient id="thumbGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="100%" stop-color="#1e3c72"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#12121c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters for glow and shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="2340" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="300" r="350" fill="#7c3aed" opacity="0.15" filter="blur(90px)"/>
  <circle cx="100" cy="1100" r="400" fill="#3b82f6" opacity="0.1" filter="blur(100px)"/>

  <!-- Top System Bar (Android 15) -->
  <g id="statusBar">
    <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff">09:41</text>
    
    <!-- Camera Punch Hole Indicator -->
    <circle cx="540" cy="70" r="22" fill="#000000"/>
    <circle cx="540" cy="70" r="23" stroke="#27272a" stroke-width="2" fill="none"/>

    <!-- Status Icons: 5G, Wi-Fi, Battery -->
    <g transform="translate(860, 52)">
      <!-- WiFi Icon -->
      <path d="M0,24 A18,18 0 0,1 26,24 M4,18 A24,24 0 0,1 22,18 M8,12 A30,30 0 0,1 18,12 M13,27 A2,2 0 1,1 13,29" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- 5G text -->
      <text x="45" y="26" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">5G</text>
      <!-- Battery -->
      <rect x="95" y="6" width="46" height="24" rx="6" stroke="#ffffff" stroke-width="3" fill="none"/>
      <rect x="142" y="14" width="4" height="8" rx="2" fill="#ffffff"/>
      <rect x="99" y="10" width="34" height="16" rx="3" fill="#10b981"/>
    </g>
  </g>

  <!-- App Header / Toolbar -->
  <g id="appHeader" transform="translate(60, 130)">
    <!-- App Logo & Branding -->
    <rect x="0" y="0" width="70" height="70" rx="20" fill="url(#accentGrad)" filter="url(#accentGlow)"/>
    <polygon points="28,20 50,35 28,50" fill="#ffffff"/>
    
    <text x="88" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Video<tspan fill="#a855f7">Hub</tspan></text>
    
    <!-- Ad-Free Badge Pill -->
    <rect x="315" y="14" width="140" height="42" rx="21" fill="url(#badgeGrad)"/>
    <text x="385" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">✓ ZERO ADS</text>

    <!-- Header Right Action Icons -->
    <g transform="translate(740, 10)">
      <!-- Cast Icon -->
      <rect x="0" y="5" width="45" height="35" rx="6" stroke="#d4d4d8" stroke-width="3" fill="none"/>
      <path d="M5,40 A10,10 0 0,1 15,40 M5,33 A18,18 0 0,1 23,40" stroke="#d4d4d8" stroke-width="3" fill="none"/>
      <!-- Notification Bell -->
      <path d="M75,32 C75,20 85,15 90,15 C95,15 105,20 105,32 L110,38 L70,38 Z M85,42 A5,5 0 0,0 95,42" stroke="#d4d4d8" stroke-width="3" fill="none"/>
      <circle cx="106" cy="14" r="7" fill="#ef4444"/>
      <!-- Search Icon -->
      <circle cx="160" cy="24" r="14" stroke="#d4d4d8" stroke-width="3" fill="none"/>
      <line x1="171" y1="35" x2="183" y2="47" stroke="#d4d4d8" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Filter Chips (Jetpack Compose LazyRow) -->
  <g id="chipsRow" transform="translate(60, 240)">
    <!-- Active Chip: All -->
    <rect x="0" y="0" width="110" height="64" rx="20" fill="url(#accentGrad)" filter="url(#accentGlow)"/>
    <text x="55" y="41" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">All</text>

    <!-- Chip 2: Kotlin 2.0 -->
    <rect x="130" y="0" width="170" height="64" rx="20" fill="#181824" stroke="#2e2e42" stroke-width="2"/>
    <text x="215" y="41" font-family="sans-serif" font-size="24" font-weight="600" fill="#d4d4d8" text-anchor="middle">⚡ Kotlin 2.0</text>

    <!-- Chip 3: 4K HDR -->
    <rect x="320" y="0" width="150" height="64" rx="20" fill="#181824" stroke="#2e2e42" stroke-width="2"/>
    <text x="395" y="41" font-family="sans-serif" font-size="24" font-weight="600" fill="#d4d4d8" text-anchor="middle">🎬 4K HDR</text>

    <!-- Chip 4: SponsorBlock -->
    <rect x="490" y="0" width="220" height="64" rx="20" fill="#181824" stroke="#2e2e42" stroke-width="2"/>
    <text x="600" y="41" font-family="sans-serif" font-size="24" font-weight="600" fill="#d4d4d8" text-anchor="middle">🛡️ SponsorBlock</text>

    <!-- Chip 5: Jetpack Compose -->
    <rect x="730" y="0" width="230" height="64" rx="20" fill="#181824" stroke="#2e2e42" stroke-width="2"/>
    <text x="845" y="41" font-family="sans-serif" font-size="24" font-weight="600" fill="#d4d4d8" text-anchor="middle">📱 Compose UI</text>
  </g>

  <!-- Video Feed Card 1 (Main Hero Video Card) -->
  <g id="feedCard1" transform="translate(60, 345)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="960" height="780" rx="36" fill="url(#cardGrad)" stroke="#272738" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Thumbnail Preview Container -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="924" height="520" rx="26" fill="url(#thumbGrad1)"/>
      
      <!-- Tech Illustration inside Thumbnail -->
      <circle cx="462" cy="260" r="140" fill="#8b5cf6" opacity="0.25"/>
      <circle cx="462" cy="260" r="90" fill="#6366f1" opacity="0.4"/>
      
      <!-- Big Play Button Center -->
      <circle cx="462" cy="260" r="54" fill="#8b5cf6" opacity="0.95" filter="url(#accentGlow)"/>
      <polygon points="452,240 482,260 452,280" fill="#ffffff"/>

      <!-- Thumbnail Tech Badges -->
      <rect x="28" y="28" width="180" height="46" rx="14" fill="#000000" opacity="0.75"/>
      <text x="118" y="59" font-family="sans-serif" font-size="22" font-weight="800" fill="#a855f7" text-anchor="middle">✦ 4K 60FPS</text>

      <rect x="220" y="28" width="190" height="46" rx="14" fill="#10b981" opacity="0.9"/>
      <text x="315" y="59" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">🛡️ SPONSOR-FREE</text>

      <!-- Video Duration Badge -->
      <rect x="780" y="446" width="116" height="48" rx="14" fill="#09090b" opacity="0.9"/>
      <text x="838" y="478" font-family="monospace" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">24:18</text>
    </g>

    <!-- Channel Avatar & Video Meta -->
    <g transform="translate(24, 565)">
      <!-- Channel Avatar Circle -->
      <rect x="0" y="8" width="86" height="86" rx="43" fill="url(#accentGrad)"/>
      <text x="43" y="62" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">VH</text>

      <!-- Video Title -->
      <text x="112" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f4f4f5">VideoHub Architecture: Kotlin 2.0 &amp; Compose</text>
      <text x="112" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f4f4f5">ExoPlayer Background Audio Engine</text>

      <!-- Channel Name & Views -->
      <text x="112" y="122" font-family="sans-serif" font-size="24" font-weight="600" fill="#a1a1aa">
        CrazyStore Official &bull; 480K views &bull; 3 hours ago
      </text>

      <!-- Verified Checkmark -->
      <circle cx="340" cy="115" r="10" fill="#8b5cf6"/>
      <path d="M336,115 L339,118 L345,112" stroke="#ffffff" stroke-width="2.5" fill="none"/>

      <!-- 3-Dots Menu -->
      <circle cx="890" cy="30" r="5" fill="#a1a1aa"/>
      <circle cx="890" cy="48" r="5" fill="#a1a1aa"/>
      <circle cx="890" cy="66" r="5" fill="#a1a1aa"/>
    </g>
  </g>

  <!-- Video Feed Card 2 -->
  <g id="feedCard2" transform="translate(60, 1160)">
    <rect x="0" y="0" width="960" height="780" rx="36" fill="url(#cardGrad)" stroke="#272738" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Thumbnail Preview 2 -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="924" height="520" rx="26" fill="url(#thumbGrad2)"/>
      
      <!-- Cyan/Blue visual artwork -->
      <rect x="180" y="100" width="560" height="320" rx="20" fill="#06b6d4" opacity="0.15" transform="rotate(-4 460 260)"/>
      <circle cx="462" cy="260" r="60" fill="#06b6d4" opacity="0.9" filter="url(#accentGlow)"/>
      <polygon points="452,240 482,260 452,280" fill="#ffffff"/>

      <rect x="28" y="28" width="220" height="46" rx="14" fill="#000000" opacity="0.75"/>
      <text x="138" y="59" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle">🎧 HI-FI AUDIO</text>

      <rect x="780" y="446" width="116" height="48" rx="14" fill="#09090b" opacity="0.9"/>
      <text x="838" y="478" font-family="monospace" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">58:30</text>
    </g>

    <!-- Channel Avatar & Video Meta 2 -->
    <g transform="translate(24, 565)">
      <rect x="0" y="8" width="86" height="86" rx="43" fill="#0284c7"/>
      <text x="43" y="62" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">LB</text>

      <text x="112" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f4f4f5">Lofi Beats for Android Coding &bull; Deep Focus</text>
      <text x="112" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f4f4f5">Background Audio Mode &bull; 320kbps Opus</text>

      <text x="112" y="122" font-family="sans-serif" font-size="24" font-weight="600" fill="#a1a1aa">
        Chill Beats &bull; 1.2M views &bull; Streamed live
      </text>

      <!-- 3-Dots Menu -->
      <circle cx="890" cy="30" r="5" fill="#a1a1aa"/>
      <circle cx="890" cy="48" r="5" fill="#a1a1aa"/>
      <circle cx="890" cy="66" r="5" fill="#a1a1aa"/>
    </g>
  </g>

  <!-- Floating Mini Player / Now Playing Bar -->
  <g id="miniPlayer" transform="translate(60, 1970)">
    <rect x="0" y="0" width="960" height="120" rx="30" fill="#1c1c28" stroke="#38384f" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Mini Thumbnail -->
    <rect x="14" y="14" width="92" height="92" rx="20" fill="url(#thumbGrad1)"/>
    <polygon points="52,50 68,60 52,70" fill="#ffffff"/>

    <!-- Track title -->
    <text x="126" y="54" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">VideoHub: Background Audio</text>
    <text x="126" y="88" font-family="sans-serif" font-size="20" font-weight="600" fill="#10b981">✓ SponsorBlock skipped 45s intro</text>

    <!-- Mini Controls -->
    <g transform="translate(760, 36)">
      <!-- Play/Pause circle -->
      <circle cx="70" cy="24" r="26" fill="url(#accentGrad)"/>
      <rect x="62" y="14" width="6" height="20" rx="2" fill="#ffffff"/>
      <rect x="72" y="14" width="6" height="20" rx="2" fill="#ffffff"/>
      
      <!-- Close X -->
      <line x1="130" y1="12" x2="150" y2="36" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="150" y1="12" x2="130" y2="36" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Material 3 Jetpack Compose) -->
  <g id="bottomNav" transform="translate(0, 2120)">
    <!-- Bar background with subtle top line -->
    <rect x="0" y="0" width="1080" height="220" fill="#0d0d14"/>
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#222232" stroke-width="2"/>

    <!-- Nav Item 1: Home (Active Pill) -->
    <g transform="translate(108, 28)">
      <rect x="-35" y="0" width="90" height="52" rx="26" fill="#8b5cf6" opacity="0.25"/>
      <path d="M-5,16 L10,4 L25,16 L25,36 L-5,36 Z" fill="#8b5cf6"/>
      <text x="10" y="80" font-family="sans-serif" font-size="22" font-weight="800" fill="#a855f7" text-anchor="middle">Home</text>
    </g>

    <!-- Nav Item 2: Trending -->
    <g transform="translate(324, 28)">
      <path d="M0,14 L12,2 L18,8 L30,-4" stroke="#9ca3af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <polygon points="26,-6 32,-4 30,2" fill="#9ca3af"/>
      <text x="14" y="80" font-family="sans-serif" font-size="22" font-weight="600" fill="#9ca3af" text-anchor="middle">Trending</text>
    </g>

    <!-- Nav Item 3: Subscriptions -->
    <g transform="translate(540, 28)">
      <rect x="-4" y="4" width="28" height="28" rx="6" stroke="#9ca3af" stroke-width="3" fill="none"/>
      <rect x="2" y="-2" width="28" height="28" rx="6" stroke="#6b7280" stroke-width="2" fill="none"/>
      <text x="14" y="80" font-family="sans-serif" font-size="22" font-weight="600" fill="#9ca3af" text-anchor="middle">Library</text>
    </g>

    <!-- Nav Item 4: Downloads -->
    <g transform="translate(756, 28)">
      <path d="M12,4 L12,24 M6,18 L12,24 L18,18" stroke="#9ca3af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <line x1="2" y1="30" x2="22" y2="30" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
      <text x="12" y="80" font-family="sans-serif" font-size="22" font-weight="600" fill="#9ca3af" text-anchor="middle">Offline</text>
    </g>

    <!-- Nav Item 5: Settings -->
    <g transform="translate(972, 28)">
      <circle cx="10" cy="18" r="10" stroke="#9ca3af" stroke-width="3" fill="none"/>
      <path d="M10,2 L10,6 M10,30 L10,34 M-4,18 L0,18 M20,18 L24,18" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <text x="10" y="80" font-family="sans-serif" font-size="22" font-weight="600" fill="#9ca3af" text-anchor="middle">Settings</text>
    </g>

    <!-- Android Home Navigation Pill Indicator -->
    <rect x="420" y="165" width="240" height="8" rx="4" fill="#71717a"/>
  </g>
</svg>
