<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="1080" height="2340">
  <defs>
    <linearGradient id="bgSettings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="50%" stop-color="#0e0e17"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="purpleM3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="switchOn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="switchOnGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="settingsCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep OLED Background -->
  <rect width="1080" height="2340" fill="url(#bgSettings)"/>

  <!-- Top System Bar -->
  <g id="statusBar4">
    <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff">09:41</text>
    <circle cx="540" cy="70" r="22" fill="#000000"/>
    <circle cx="540" cy="70" r="23" stroke="#27272a" stroke-width="2" fill="none"/>
    <g transform="translate(860, 52)">
      <path d="M0,24 A18,18 0 0,1 26,24 M4,18 A24,24 0 0,1 22,18 M8,12 A30,30 0 0,1 18,12 M13,27 A2,2 0 1,1 13,29" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <text x="45" y="26" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff">5G</text>
      <rect x="95" y="6" width="46" height="24" rx="6" stroke="#ffffff" stroke-width="3" fill="none"/>
      <rect x="142" y="14" width="4" height="8" rx="2" fill="#ffffff"/>
      <rect x="99" y="10" width="34" height="16" rx="3" fill="#10b981"/>
    </g>
  </g>

  <!-- Settings Top App Bar -->
  <g id="settingsHeader" transform="translate(60, 130)">
    <path d="M30,10 L10,30 L30,50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Settings &amp; Engine</text>

    <!-- Search in settings -->
    <g transform="translate(900, 14)">
      <circle cx="16" cy="16" r="14" stroke="#ffffff" stroke-width="3.5" fill="none"/>
      <line x1="26" y1="26" x2="38" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Section 1: Dynamic Material You Theming -->
  <g id="themeSection" transform="translate(60, 240)">
    <text x="10" y="30" font-family="sans-serif" font-size="22" font-weight="800" fill="#a855f7" letter-spacing="1">
      MATERIAL 3 &bull; DYNAMIC YOU THEMING
    </text>

    <rect x="0" y="50" width="960" height="280" rx="36" fill="#151522" stroke="#252538" stroke-width="2" filter="url(#settingsCardShadow)"/>

    <!-- Theme Swatches Row -->
    <g transform="translate(40, 95)">
      <!-- Swatch 1: AMOLED Violet (Active Selected) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="130" rx="24" fill="#09090b" stroke="#a855f7" stroke-width="4"/>
        <circle cx="50" cy="50" r="28" fill="#8b5cf6"/>
        <circle cx="100" cy="50" r="28" fill="#6366f1"/>
        <text x="98" y="105" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">AMOLED Violet</text>
        <!-- Active Checkmark badge -->
        <circle cx="170" cy="24" r="16" fill="#a855f7"/>
        <path d="M164,24 L168,28 L176,18" stroke="#ffffff" stroke-width="2.5" fill="none"/>
      </g>

      <!-- Swatch 2: Emerald Dark -->
      <g transform="translate(225, 0)">
        <rect x="0" y="0" width="195" height="130" rx="24" fill="#061c16" stroke="#1f2937" stroke-width="2"/>
        <circle cx="50" cy="50" r="28" fill="#10b981"/>
        <circle cx="100" cy="50" r="28" fill="#06b6d4"/>
        <text x="98" y="105" font-family="sans-serif" font-size="18" font-weight="700" fill="#9ca3af" text-anchor="middle">Emerald Pro</text>
      </g>

      <!-- Swatch 3: Ocean Blue -->
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="195" height="130" rx="24" fill="#0b1329" stroke="#1f2937" stroke-width="2"/>
        <circle cx="50" cy="50" r="28" fill="#3b82f6"/>
        <circle cx="100" cy="50" r="28" fill="#0ea5e9"/>
        <text x="98" y="105" font-family="sans-serif" font-size="18" font-weight="700" fill="#9ca3af" text-anchor="middle">Oceanic</text>
      </g>

      <!-- Swatch 4: Android 15 Dynamic Wallpaper -->
      <g transform="translate(675, 0)">
        <rect x="0" y="0" width="195" height="130" rx="24" fill="#181822" stroke="#1f2937" stroke-width="2"/>
        <circle cx="50" cy="50" r="28" fill="#f43f5e"/>
        <circle cx="100" cy="50" r="28" fill="#fbbf24"/>
        <text x="98" y="105" font-family="sans-serif" font-size="18" font-weight="700" fill="#9ca3af" text-anchor="middle">Material You</text>
      </g>
    </g>

    <text x="40" y="295" font-family="sans-serif" font-size="20" font-weight="600" fill="#a1a1aa">
      Extracts dynamic accent palette directly from your Android wallpaper
    </text>
  </g>

  <!-- Section 2: SponsorBlock Automated Protection Switches -->
  <g id="sponsorSection" transform="translate(60, 610)">
    <text x="10" y="30" font-family="sans-serif" font-size="22" font-weight="800" fill="#34d399" letter-spacing="1">
      SPONSORBLOCK &bull; AUTOMATION FILTERS
    </text>

    <rect x="0" y="50" width="960" height="480" rx="36" fill="#0d1b17" stroke="#059669" stroke-width="2" filter="url(#settingsCardShadow)"/>

    <!-- Switch 1: Auto-skip sponsors -->
    <g transform="translate(40, 100)">
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
        Auto-Skip In-Video Sponsors
      </text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#6ee7b7">
        Instantly skips paid promotion segments without user interaction
      </text>

      <!-- Material 3 Switch On -->
      <g transform="translate(770, 6)">
        <rect x="0" y="0" width="105" height="60" rx="30" fill="url(#switchOnGreen)"/>
        <circle cx="75" cy="30" r="24" fill="#ffffff" filter="url(#settingsCardShadow)"/>
        <path d="M68,30 L73,35 L82,24" stroke="#059669" stroke-width="3" fill="none"/>
      </g>
    </g>

    <line x1="40" y1="210" x2="920" y2="210" stroke="#164e3f" stroke-width="1.5"/>

    <!-- Switch 2: Auto-skip intros & outros -->
    <g transform="translate(40, 240)">
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
        Auto-Skip Intros, Outros &amp; Credits
      </text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#6ee7b7">
        Jumps directly to the actual video content
      </text>

      <g transform="translate(770, 6)">
        <rect x="0" y="0" width="105" height="60" rx="30" fill="url(#switchOnGreen)"/>
        <circle cx="75" cy="30" r="24" fill="#ffffff" filter="url(#settingsCardShadow)"/>
        <path d="M68,30 L73,35 L82,24" stroke="#059669" stroke-width="3" fill="none"/>
      </g>
    </g>

    <line x1="40" y1="350" x2="920" y2="350" stroke="#164e3f" stroke-width="1.5"/>

    <!-- Switch 3: Interaction reminders -->
    <g transform="translate(40, 380)">
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
        Skip "Like &amp; Subscribe" Begging
      </text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#6ee7b7">
        Silently skips self-promotion and subscriber nagging
      </text>

      <g transform="translate(770, 6)">
        <rect x="0" y="0" width="105" height="60" rx="30" fill="url(#switchOnGreen)"/>
        <circle cx="75" cy="30" r="24" fill="#ffffff" filter="url(#settingsCardShadow)"/>
        <path d="M68,30 L73,35 L82,24" stroke="#059669" stroke-width="3" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Section 3: ExoPlayer & Media Pipeline Settings -->
  <g id="exoSection" transform="translate(60, 1180)">
    <text x="10" y="30" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8" letter-spacing="1">
      EXOPLAYER &bull; HARDWARE ACCELERATION
    </text>

    <rect x="0" y="50" width="960" height="420" rx="36" fill="#131522" stroke="#252b44" stroke-width="2" filter="url(#settingsCardShadow)"/>

    <!-- Setting 1: Default Wi-Fi Quality -->
    <g transform="translate(40, 95)">
      <text x="0" y="32" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Preferred Quality (Wi-Fi)</text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#a1a1aa">Max resolution for high-speed connections</text>

      <rect x="690" y="10" width="190" height="52" rx="18" fill="#1e243d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="785" y="44" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle">4K 2160p 60fps</text>
    </g>

    <line x1="40" y1="200" x2="920" y2="200" stroke="#1e2238" stroke-width="1.5"/>

    <!-- Setting 2: Background Audio Playback -->
    <g transform="translate(40, 230)">
      <text x="0" y="32" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Continue Audio on Screen Lock</text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#a1a1aa">Retains media controls in notification tray</text>

      <g transform="translate(770, 6)">
        <rect x="0" y="0" width="105" height="60" rx="30" fill="url(#purpleM3)"/>
        <circle cx="75" cy="30" r="24" fill="#ffffff" filter="url(#settingsCardShadow)"/>
        <path d="M68,30 L73,35 L82,24" stroke="#7c3aed" stroke-width="3" fill="none"/>
      </g>
    </g>

    <line x1="40" y1="330" x2="920" y2="330" stroke="#1e2238" stroke-width="1.5"/>

    <!-- Setting 3: Hardware Decoding (AV1 / VP9) -->
    <g transform="translate(40, 360)">
      <text x="0" y="32" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">AV1 / VP9 Hardware Codec</text>
      <text x="0" y="66" font-family="sans-serif" font-size="20" font-weight="500" fill="#a1a1aa">Utilizes MediaCodec GPU pipeline for 0% lag</text>

      <g transform="translate(770, 6)">
        <rect x="0" y="0" width="105" height="60" rx="30" fill="url(#purpleM3)"/>
        <circle cx="75" cy="30" r="24" fill="#ffffff" filter="url(#settingsCardShadow)"/>
        <path d="M68,30 L73,35 L82,24" stroke="#7c3aed" stroke-width="3" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Section 4: Privacy & De-Googled Diagnostics -->
  <g id="privacySection" transform="translate(60, 1700)">
    <text x="10" y="30" font-family="sans-serif" font-size="22" font-weight="800" fill="#eab308" letter-spacing="1">
      PRIVACY &bull; 100% DE-GOOGLED ARCHITECTURE
    </text>

    <rect x="0" y="50" width="960" height="340" rx="36" fill="#181510" stroke="#b45309" stroke-width="2" filter="url(#settingsCardShadow)"/>

    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="54" height="54" rx="16" fill="#f59e0b"/>
      <text x="27" y="37" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">🛡️</text>

      <text x="74" y="24" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Google Play Services: Not Required</text>
      <text x="74" y="54" font-family="sans-serif" font-size="20" font-weight="500" fill="#fbbf24">Runs natively on GrapheneOS, CalyxOS, MicroG or AOSP</text>
    </g>

    <line x1="40" y1="180" x2="920" y2="180" stroke="#3d2c12" stroke-width="1.5"/>

    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="54" height="54" rx="16" fill="#10b981"/>
      <text x="27" y="37" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>

      <text x="74" y="24" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Zero Analytics &amp; Zero Tracking</text>
      <text x="74" y="54" font-family="sans-serif" font-size="20" font-weight="500" fill="#34d399">All watch history and subscriptions stay encrypted locally</text>
    </g>

    <g transform="translate(40, 310)">
      <rect x="0" y="0" width="260" height="50" rx="16" fill="#2d2212" stroke="#d97706" stroke-width="1.5"/>
      <text x="130" y="32" font-family="sans-serif" font-size="19" font-weight="800" fill="#fbbf24" text-anchor="middle">📥 Export Local Data (JSON)</text>
    </g>
  </g>

  <!-- App Version Footer -->
  <g transform="translate(540, 2180)">
    <text x="0" y="0" font-family="sans-serif" font-size="22" font-weight="700" fill="#71717a" text-anchor="middle">
      VideoHub v2.4.0 (Build 2400) &bull; Kotlin 2.0 &bull; Jetpack Compose 1.7
    </text>
    <text x="0" y="30" font-family="sans-serif" font-size="18" font-weight="600" fill="#52525b" text-anchor="middle">
      CrazyStore Verified Native Android Application
    </text>
  </g>

  <!-- Android Bottom Home Pill -->
  <rect x="420" y="2280" width="240" height="8" rx="4" fill="#71717a"/>
</svg>
